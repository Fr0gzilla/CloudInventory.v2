version: "3.8"

services:
  web:
    build: .
    ports:
      - "5050:5050"
    # Secrets et identifiants : jamais en clair ici. Copier .env.example en .env
    # (non versionné) puis y définir SECRET_KEY, JWT_SECRET_KEY, ADMIN_PASSWORD.
    # Générer les clés : python -c "import secrets; print(secrets.token_hex(32))"
    env_file:
      - .env
    volumes:
      - db-data:/app/instance
    restart: unless-stopped

volumes:
  db-data:
